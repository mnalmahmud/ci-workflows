name: Build Android APK Bundle (AAB)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository (owner/name)"
        required: true
      target_ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "main"
      project_key:
        description: "Project key (selects projects/<project_key>/)"
        required: true
      apply_patches:
        description: "Apply patches from the project patch set"
        required: false
        type: boolean
        default: true
      patch_set:
        description: "Patch set name (subdirectory under patches/)"
        required: false
        default: "default"
      artifact_name:
        description: "Name for the uploaded artifact"
        required: false
        default: "android-aab-artifacts"
      flutter_channel:
        description: "Flutter channel (stable/beta/master) — only used when USE_FLUTTER=true"
        required: false
        default: "stable"
      flutter_version:
        description: "Flutter version pin, e.g. 3.19.0 (or 'any')"
        required: false
        default: "any"

jobs:
  build-android-aab:
    runs-on: ubuntu-latest

    env:
      TARGET_REPO:       ${{ inputs.target_repo }}
      TARGET_REF:        ${{ inputs.target_ref }}
      PROJECT_KEY:       ${{ inputs.project_key }}
      PATCH_SET:         ${{ inputs.patch_set }}
      BUILD_VARIANT:     aab
      FLUTTER_CHANNEL:   ${{ inputs.flutter_channel }}
      FLUTTER_VERSION:   ${{ inputs.flutter_version }}
      ARTIFACT_NAME:     ${{ inputs.artifact_name }}
      TARGET_DIR:        work/target
      PACKAGE_DIR:       work/artifacts
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}

    steps:
      # ── 1. Checkout orchestrator repo ───────────────────────────────────────
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4

      # ── 2. Restore caches ───────────────────────────────────────────────────
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ inputs.project_key }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ inputs.project_key }}-${{ runner.os }}-

      - name: Restore Flutter/pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/flutter
          key: flutter-${{ inputs.project_key }}-${{ inputs.flutter_channel }}-${{ inputs.flutter_version }}-${{ runner.os }}
          restore-keys: |
            flutter-${{ inputs.project_key }}-${{ inputs.flutter_channel }}-

      # ── 3. Set up Java for Android builds ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 4. Checkout target repository ───────────────────────────────────────
      - name: Checkout target repository
        run: bash scripts/checkout_target.sh

      # ── 5. Apply patches (optional) ─────────────────────────────────────────
      - name: Apply patches
        if: ${{ inputs.apply_patches == true }}
        run: bash scripts/apply_patches.sh

      # ── 6. Run Android AAB build ─────────────────────────────────────────────
      - name: Run build (android aab)
        run: bash scripts/run_build.sh android

      # ── 7. Package artifacts ─────────────────────────────────────────────────
      - name: Package artifacts
        run: bash scripts/package_artifacts.sh

      # ── 8. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: work/artifacts/
          if-no-files-found: warn
