name: Build Android App Bundle (AAB)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository (owner/name)"
        required: true
      target_ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: "main"
      project_key:
        description: "Project key — use username-reponame format (selects projects/<project_key>/)"
        required: true
      apply_patches:
        description: "Apply patches from the project patch set"
        required: false
        type: boolean
        default: true
      patch_set:
        description: "Patch set name (subdirectory under patches/)"
        required: false
        default: "default"
      artifact_name:
        description: "Name for the uploaded artifact"
        required: false
        default: "android-aab-artifacts"
      use_flutter:
        description: "Set up Flutter toolchain before building (uses subosito/flutter-action)"
        required: false
        type: boolean
        default: false
      flutter_channel:
        description: "Flutter channel (stable/beta/master)"
        required: false
        default: "stable"
      flutter_version:
        description: "Flutter version pin, e.g. 3.24.0 (or 'any' for latest on channel)"
        required: false
        default: "any"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.project_key }}-${{ inputs.target_repo }}
  cancel-in-progress: true

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TARGET_REPO:       ${{ inputs.target_repo }}
      TARGET_REF:        ${{ inputs.target_ref }}
      PROJECT_KEY:       ${{ inputs.project_key }}
      PATCH_SET:         ${{ inputs.patch_set }}
      BUILD_VARIANT:     aab
      FLUTTER_CHANNEL:   ${{ inputs.flutter_channel }}
      FLUTTER_VERSION:   ${{ inputs.flutter_version }}
      ARTIFACT_NAME:     ${{ inputs.artifact_name }}
      TARGET_DIR:        work/target
      PACKAGE_DIR:       work/artifacts
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}

    steps:
      # ── 1. Checkout orchestrator repo ───────────────────────────────────────
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4

      # ── 2. Restore Gradle cache ──────────────────────────────────────────────
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ inputs.project_key }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ inputs.project_key }}-${{ runner.os }}-

      # ── 3. Set up Flutter (optional) ────────────────────────────────────────
      # Enabled when use_flutter=true. Handles SDK download, PATH, and caching.
      - name: Set up Flutter
        if: ${{ inputs.use_flutter == true }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version != 'any' && inputs.flutter_version || '' }}
          cache: true

      # ── 4. Set up JDK 17 ────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 5. Set up Android signing ────────────────────────────────────────────
      # Runs only when the ANDROID_KEYSTORE_BASE64 secret is configured.
      # Exports ANDROID_KEYSTORE_PATH, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
      # and ANDROID_STORE_PASSWORD into the environment for use by the build.
      - name: Set up Android signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS:  ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "[signing] Decoding keystore…"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > /tmp/keystore.jks
          echo "ANDROID_KEYSTORE_PATH=/tmp/keystore.jks"            >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEYSTORE_ALIAS}"        >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"  >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "[signing] Keystore ready at /tmp/keystore.jks"

      # ── 6. Checkout target repository ───────────────────────────────────────
      - name: Checkout target repository
        run: bash scripts/checkout_target.sh

      # ── 7. Apply patches (optional) ─────────────────────────────────────────
      - name: Apply patches
        if: ${{ inputs.apply_patches == true }}
        run: bash scripts/apply_patches.sh

      # ── 8. Run Android AAB build ─────────────────────────────────────────────
      - name: Run build (android aab)
        run: bash scripts/run_build.sh android

      # ── 9. Package artifacts ─────────────────────────────────────────────────
      - name: Package artifacts
        run: bash scripts/package_artifacts.sh

      # ── 10. Upload artifacts ─────────────────────────────────────────────────
      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: work/artifacts/
          if-no-files-found: warn
